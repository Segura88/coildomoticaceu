services:
  mosquitto:
    image: eclipse-mosquitto:latest
    environment:
      TZ: Europe/Madrid
    ports:
      - "${MQTT_PORT}:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: unless-stopped

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.6.3
    environment:
      TZ: Europe/Madrid
    volumes:
      - ./homeassistant:/config
    ports:
      - "${HA_PORT}:8123"
    depends_on:
      - mosquitto
      - nodered
      - zigbee2mqtt
    restart: unless-stopped

  nodered:
    image: nodered/node-red:latest
    environment:
      TZ: Europe/Madrid
    ports:
      - "${NODERED_PORT}:1880"
    volumes:
      - ./nodered:/data
    restart: unless-stopped

  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:latest
    restart: unless-stopped
    volumes:
      - ./zigbee2mqtt/data:/app/data
      - /run/udev:/run/udev:ro
    devices:
      - "${ZIGBEE_DEVICE}:/dev/ttyUSB0"
    ports:
      - "${ZIGBEE_PORT}:8080"
    environment:
      TZ: Europe/Madrid
    depends_on:
      - mosquitto

  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    volumes:
      - /etc/localtime:/etc/localtime:ro
    environment:
      TUNNEL_TOKEN: "${TUNNEL_TOKEN:?Define TUNNEL_TOKEN in .env}"